name: Test, Cloud Run, GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

env:
  REGION: us-central1
  SERVICE: navaid
  AR_REPO: navaid

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python scripts/build_snapshot.py --offline --force-fixtures
          pytest -q

  api:
    name: Cloud Run
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Require GCP secrets
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PROJECT" ]; then
            echo "::error::Add GitHub secrets GCP_PROJECT_ID and GCP_SA_KEY (see docs/DEPLOY.md)."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build, push, deploy
        id: deploy
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/api:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/api:latest" .
          docker push "$IMAGE"
          docker push "${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/api:latest"
          ENV_VARS="NAVAID_OFFLINE=1,GOOGLE_CLOUD_PROJECT=${PROJECT},GOOGLE_CLOUD_LOCATION=${REGION}"
          if [ -n "$GEMINI_API_KEY" ]; then
            ENV_VARS="${ENV_VARS},GEMINI_API_KEY=${GEMINI_API_KEY}"
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 8 \
            --set-env-vars "$ENV_VARS" \
            --quiet
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Cloud Run URL: ${URL}"

  pages:
    name: GitHub Pages
    needs: [test, api]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export static site
        env:
          API_URL: ${{ needs.api.outputs.url }}
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic python-dotenv
          ROOT="/${GITHUB_REPOSITORY#*/}"
          if [ "${GITHUB_REPOSITORY#*/}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            ROOT=""
          fi
          PYTHONPATH=. python scripts/export_site.py --out site-dist --api-url "$API_URL" --root "$ROOT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: publish
        uses: actions/deploy-pages@v4
